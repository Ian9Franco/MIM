name: Release MIM Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v10.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows Standalone
        run: npm run package:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MIM v10.5.0 — Modular Systems Engineering Platform
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v10.5.0' }}
          body_path: docs/release-notes-v10.5.0.md
          draft: false
          prerelease: false
          files: |
            dist/MIM Setup 10.5.0.exe
            dist/MIM 10.5.0.exe
            dist/MIM Setup 10.5.0.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
