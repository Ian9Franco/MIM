---
engines:
  eslint:
    enabled: true
  duplication:
    enabled: true
    config:
      min_length: 50

exclude_paths:
  - scripts/__tests__/**
  - scripts/evaluation/**
  - scripts/scratch/**
  - standalone/**
  - node_modules/**
  - .next/**
  - out/**
  - build/**
  - dist/**
  - standalone/node_modules/**
  - pnpm-lock.yaml
  - package-lock.json
  - "*.tsbuildinfo"
  - next-env.d.ts
  - public/**
