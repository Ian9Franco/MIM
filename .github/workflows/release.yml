name: Release MIM Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v11.3.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows Standalone
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.ref_name || inputs.tag_name || 'v11.3.0' }}"
          FILE="docs/releases/release-notes-${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> $GITHUB_OUTPUT
          elif [ -f "docs/releases/CHANGELOG.md" ]; then
            echo "path=docs/releases/CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MIM ${{ github.ref_name || inputs.tag_name || 'v11.3.0' }} — Systems Platform & MIM-Bot
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v11.3.0' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

