name: MIM Systems Engineering CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Root TypeScript Types
        run: npx tsc --noEmit

      - name: Verify MIMweb TypeScript Types
        run: npx tsc --project web/tsconfig.json --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Verify API Guard Route Shielding
        run: npm run lint:api-guard

  test-and-evaluate:
    name: Systems Test Suite & Benchmark Evaluation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suites & Generate Audited Coverage
        run: npm run test:coverage

      - name: Upload Audited Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mim-engine-coverage
          path: coverage/

  dast-security-audit:
    name: Dynamic Application Security Testing (DAST) Baseline
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install MIMweb Dependencies
        run: npm ci --prefix web

      - name: Build MIMweb from this revision
        run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Audit this revision on localhost
        shell: bash
        run: |
          npm run start --prefix web -- --hostname 127.0.0.1 --port 3100 > /tmp/mim-dast-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/mim-dast-server.log; exit 1; fi
          node scripts/security/dast-scan.js http://127.0.0.1:3100

  build-production:
    name: Next.js Production Build Verification
    runs-on: ubuntu-latest
    needs: [test-and-evaluate, dast-security-audit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
