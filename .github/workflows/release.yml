name: Release MIM Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        description: 'Existing version tag to build and publish (for example v11.4.5)'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone & Publish Release
    runs-on: windows-latest
    steps:
      - name: Resolve Release Tag
        id: release
        shell: node {0}
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          const fs = require('node:fs');
          const tag = process.env.RELEASE_EVENT === 'workflow_dispatch'
            ? process.env.RELEASE_INPUT_TAG
            : process.env.RELEASE_REF_TYPE === 'tag' ? process.env.RELEASE_REF_NAME : '';
          if (!/^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag || '')) {
            throw new Error('An explicit version tag is required to publish a release');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Tag push builds the tagged commit. Manual dispatch builds main tip so
          # packaging fixes can republish an existing tag without retagging.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || format('refs/tags/{0}', steps.release.outputs.tag) }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ssh2 pulls optional native dep cpu-features, which fails to rebuild against
      # Electron 42 headers on MSVC (__builtin_frame_address). The Next server is
      # forked as plain Node (standalone/main.js), so Electron ABI rebuild is
      # unnecessary; removing the optional addon makes ssh2 use its JS fallback.
      - name: Drop optional cpu-features before Electron packaging
        shell: pwsh
        run: |
          if (Test-Path node_modules/cpu-features) {
            Remove-Item -Recurse -Force node_modules/cpu-features
            Write-Host "Removed node_modules/cpu-features"
          } else {
            Write-Host "cpu-features not present; nothing to remove"
          }

      # Authenticode signing is optional: when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
      # are unset, electron-builder publishes an unsigned build (SmartScreen warning).
      # When set, Windows artifacts are signed so the publisher is no longer "Unknown".
      - name: Package Windows Standalone
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Prefer the explicit CI cert; do not scavenge random certs on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify updater assets before publishing
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/verify-release-assets.js dist "$env:RELEASE_TAG"

      - name: Resolve Release Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          FILE="docs/releases/release-notes-${RELEASE_TAG}.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> $GITHUB_OUTPUT
          elif [ -f "docs/releases/CHANGELOG.md" ]; then
            echo "path=docs/releases/CHANGELOG.md" >> $GITHUB_OUTPUT
          else
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MIM ${{ steps.release.outputs.tag }} — Systems Platform & MIM-Bot
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

